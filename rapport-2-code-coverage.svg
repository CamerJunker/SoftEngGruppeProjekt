    .label { font-size: 13px; }
    .value { font-size: 13px; font-weight: 700; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .bg { fill: #eef2f7; }
    .bar-low { fill: #dc2626; }
    .bar-mid { fill: #f59e0b; }
