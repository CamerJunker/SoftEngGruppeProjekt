<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img" aria-labelledby="title desc">
  <title id="title">Code coverage per Java file</title>
  <desc id="desc">Bar chart showing line coverage per Java file after all tests have been run with JaCoCo. Only projectmanagement files are included.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1f2937; }
    .title { font-size: 24px; font-weight: 700; }
